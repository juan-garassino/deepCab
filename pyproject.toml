[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepCab"
version = "0.1.0"
description = "NYC taxi-fare MLOps learning hub"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Garassino", email = "juan.garassino@gmail.com" }]
requires-python = ">=3.10,<3.12"

dependencies = [
    "colorama",
    "numpy",
    "pandas",
    "polars>=0.20",
    "duckdb",
    "pandera[polars]>=0.20",
    "pyarrow",
    "pygeohash",
    "pytz",
    "scikit-learn",
    "tensorflow>=2.15,<2.17",
    "torch>=2.1,<2.6",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "mlflow>=2.9,<3",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette>=2.1",
    "websockets>=12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "openai>=1.30",
    "optuna>=3.6",
    "pyyaml>=6",
    "shap>=0.45",
    "structlog>=24",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "google-cloud-bigquery<3.0.0",
    "google-cloud-storage",
    "prefect>=3.0,<4",
    "psycopg2-binary",
    "redis>=5.0",
    "strawberry-graphql[fastapi]>=0.240",
    "grpcio>=1.62",  # grpcio-tools deferred — regen stubs via uv run --with grpcio-tools when needed
]

[project.optional-dependencies]
dev = [
    "ipdb",
    "ipykernel",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "matplotlib",
    "seaborn",
]
silicon = [
    "tensorflow-macos>=2.15,<2.17 ; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "tensorflow-metal ; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxmltools>=1.12",
    "skl2onnx>=1.16",
    "tf2onnx>=1.16",
]
notebook = [
    "pyngrok>=7.1.6",
    "jupyter-server>=2.14",
]

[project.urls]
Repository = "https://github.com/juan-garassino/deepCab"

[tool.hatch.build.targets.wheel]
packages = ["deepCab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "--color=yes -W ignore::DeprecationWarning"
