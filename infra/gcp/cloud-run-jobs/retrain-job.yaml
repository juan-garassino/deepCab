# ⚠️ Deprecated as of 2026-06-04 (Plan G2)
#
# This raw Cloud Run Job spec has been superseded by Terraform in the
# platform repo. See ../../../../002-deepCab-platform/terraform/modules/cloud_run_job/
# for the IaC equivalent.
#
# The CI workflow .github/workflows/deploy-retrain-job.yml no longer renders
# this file — it now does an image-only `gcloud run jobs update` against
# the Job that Terraform provisions. This YAML is kept as reference for
# what Terraform produces, but should NOT be edited expecting deploy effect.
---
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: deepcab-retrain
  labels:
    cloud.googleapis.com/location: europe-west1
spec:
  template:
    spec:
      template:
        spec:
          serviceAccountName: deepcab-runtime@__GCP_PROJECT__.iam.gserviceaccount.com
          timeoutSeconds: 3600
          maxRetries: 1
          containers:
            - image: __IMAGE__
              command: ["python"]
              args:
                - "-m"
                - "deepCab.training.train"
                - "backend=tf_mlp"
                - "data=full"
              env:
                - name: APP_ENV
                  value: prod
                - name: MLFLOW_TRACKING_URI
                  value: __MLFLOW_URL__
                - name: MODEL_TARGET
                  value: gcs
                - name: GCP_PROJECT
                  value: __GCP_PROJECT__
                - name: REGISTRY_GCS_BUCKET
                  value: __MODELS_BUCKET__
              resources:
                limits:
                  cpu: "4"
                  memory: "8Gi"
