name: deepcab

# Override layer for GPU training. Compose:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build api
# Requires the nvidia container runtime on the host (`nvidia-container-toolkit`).

services:
  api:
    build:
      args:
        GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all

  prefect-agent:
    build:
      args:
        GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
