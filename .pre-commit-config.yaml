# Run via `uv run pre-commit install`. Hooks fire on every `git commit`.
# Mypy stays loose this phase — informational only — so green hooks don't lie
# about the actual type coverage.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^deepCab/config/   # Hydra OmegaConf YAMLs use tags pyyaml refuses
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: local
    hooks:
      - id: mypy-informational
        name: mypy (informational, non-blocking)
        entry: bash -c 'uv run mypy deepCab --ignore-missing-imports --check-untyped-defs || true'
        language: system
        pass_filenames: false
