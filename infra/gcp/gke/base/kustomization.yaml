# ⚠️ Deprecated as of 2026-06-04 (Plan G2)
#
# GKE cluster provisioning has been moved to Terraform in the platform repo.
# See ../../../../../002-deepCab-platform/terraform/modules/gke/ for the
# (gated, disabled-by-default) cluster module.
#
# The kustomize manifests below describe in-cluster workloads (Deployment,
# Service, ConfigMap) and are still applied by .github/workflows/deploy-gke.yml
# (dispatch-only). Cluster-level concerns (node pools, network, IAM) are
# Terraform's responsibility, not these manifests.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
