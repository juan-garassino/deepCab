name: nightly-bench

# Every-2-days sliding-window bench. Resumes its time-window cursor from MLflow
# and trains one tree-backend model on a fresh slice queried straight from the
# public NYC-taxi dataset (bigquery-public-data.new_york — the deprecated set
# that still carries lon/lat). No local Parquet, no synthesised data.
#
# Fails soft: if MLFLOW_TRACKING_URI is unset / unreachable the run logs a
# warning and exits 0 instead of going red (the old daily failure mode).

on:
  schedule:
    - cron: "0 6 */2 * *"   # 06:00 UTC, every 2 days
  workflow_dispatch:

permissions:
  contents: read
  id-token: write           # OIDC → WIF, so BQ jobs bill to our project

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENV: prod
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT: deepcab-nightly
      MLFLOW_MODEL_NAME: deepcab
      # Public dataset lives in bigquery-public-data; jobs bill to our project.
      DATA_BQ_BILLING_PROJECT: ${{ vars.GCP_PROJECT }}
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen

      # OIDC auth so the BQ client has credentials + a billing project. Without
      # GCP_WIF_PROVIDER set the step is skipped and run_nightly soft-skips
      # (no MLflow / no creds → exit 0).
      - name: Authenticate to GCP
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Sliding-window bench (real BQ, 14-day chunk)
        run: uv run python -m deepCab.flow_v2.nightly --period-days 14
