global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /run/secrets/slack_webhook_url
        channel: '#deepcab-ops'
        send_resolved: true
        title: "[alert] {{ .CommonLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *severity:* {{ .Labels.severity }}
          *summary:* {{ .Annotations.summary }}
          *description:* {{ .Annotations.description }}
          {{ end }}
