name: deploy

# Image-only Cloud Run deploy. As of Plan G2 (2026-06-04), the Cloud Run
# service shape (CPU/memory/scale/env vars/IAM) is owned by Terraform in
# the sibling repo 002-deepCab-platform/. This workflow builds + pushes
# the image to Artifact Registry, then runs `gcloud run services update
# --image=...` to point the existing service at the new image. Shape
# changes go through a Terraform PR in 002, not here.
#
# Triggered by `v*` tags (default deploy) and manual dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        default: "latest"
      model_uri:
        # NOTE: Informational only. The runtime reads MODEL_URI from the
        # Cloud Run env var, which is now set by Terraform in 002-deepCab-platform/.
        # Changing this input does NOT update the service's env var.
        description: "Optional GCS URI of the model artifact (informational; env var is owned by TF in 002)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telegram — deploy starting
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_BOT" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode=Markdown \
            -d text="🚀 *deepcab-api* deploy starting · ref=\`${{ github.ref_name }}\` · sha=\`${GITHUB_SHA:0:7}\`"

      - name: Slack — deploy starting
        continue-on-error: true
        uses: rtcamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "[ci] deploy → Cloud Run starting"
          SLACK_MESSAGE: "ref=${{ github.ref_name }} sha=${{ github.sha }}"
          SLACK_COLOR: "#cccccc"
          MSG_MINIMAL: actions url

      - name: Authenticate to GCP (OIDC / Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build, tag, and push image to Artifact Registry
        id: build
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          IMG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/deepcab/api:${TAG}"
          docker buildx build \
            --file infra/docker/Dockerfile \
            --tag "$IMG" \
            --push \
            --build-arg GPU=0 \
            .
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Update Cloud Run service image
        # Image-only update. Service shape (CPU/memory/env vars/IAM) is
        # owned by Terraform in 002-deepCab-platform/. If the service does
        # not yet exist, this command will fail with a clear error and
        # the Slack-failure step below will surface it.
        run: |
          gcloud run services update deepcab-api \
            --image=${{ steps.build.outputs.image }} \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT }} \
            --quiet

      - name: Telegram — deploy success
        if: success()
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          IMG: ${{ steps.build.outputs.image }}
        run: |
          [ -z "$TG_BOT" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode=Markdown \
            -d text="✅ *deepcab-api* deployed · \`$IMG\`"

      - name: Slack — deploy success
        if: success()
        continue-on-error: true
        uses: rtcamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: good
          SLACK_TITLE: "[ci] deploy → Cloud Run ✓"
          SLACK_MESSAGE: "${{ steps.build.outputs.image }}"

      - name: Telegram — deploy failure
        if: failure()
        continue-on-error: true
        env:
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_BOT" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d parse_mode=Markdown \
            -d text="❌ *deepcab-api* deploy FAILED · ref=\`${{ github.ref_name }}\` · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Slack — deploy failure
        if: failure()
        continue-on-error: true
        uses: rtcamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_COLOR: danger
          SLACK_TITLE: "[ci] deploy → Cloud Run ✗"
          SLACK_MESSAGE: "see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
